name: robot-diario

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar robô
        run: python robot/scrape.py

      - name: Commit de mudanças
        continue-on-error: true
        run: |
          git config user.name "acorda-sbo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/novidades.json
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "chore(robot): atualiza novidades $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            for tentativa in 1 2 3; do
              echo "Tentativa de push $tentativa..."
              git pull --rebase --autostash origin main && git push origin main && break
              sleep 5
            done
          fi

      - name: Build estático
        run: |
          mkdir -p _site
          cp -r assets data *.html _site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy para Pages
        id: deployment
        uses: actions/deploy-pages@v4
