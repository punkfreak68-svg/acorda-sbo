name: robot-diario
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar deps
        run: pip install -r requirements.txt
      - name: Rodar robô
        run: python robot/scrape.py
      - name: Commit de mudanças
        run: |
          git config user.name "acorda-sbo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/novidades.json
          git diff --cached --quiet || git commit -m "chore(robot): atualiza novidades $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
      - name: Build estático
        run: |
          mkdir _site
          cp -r assets data *.html _site/
      - name: Deploy para Pages
        uses: actions/deploy-pages@v4
